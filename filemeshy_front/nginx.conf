server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Headers de seguridad HTTP -- el backend ya los manda en sus respuestas JSON
    # (app/main.py::SecurityHeadersMiddleware), pero el HTML de la SPA (donde vive
    # la sesión real) no pasaba por ahí y salía sin ninguno.
    #
    # Ronda 10 -- CSP endurecida (antes solo `frame-ancestors 'none'`, sin
    # default-src/script-src/etc., ver pendiente.md). Directivas, de por qué
    # cada una:
    #   - default-src 'self': base restrictiva, todo lo no listado abajo cae acá.
    #   - script-src 'self' + hash del ÚNICO script inline real (ver index.html,
    #     el snippet de "aplicar tema antes de pintar" -- Vite lo deja tal cual,
    #     no lo mueve a un bundle). Confirmado en vivo que NO hace falta
    #     'unsafe-inline': los demás <script> son type=module con src= propio
    #     (mismo origen), cubiertos por 'self'. Si ese inline script de
    #     index.html cambia de contenido, este hash queda desactualizado y el
    #     tema-antes-de-pintar se rompe en silencio (CSP lo bloquea, sin error
    #     visible más que la consola) -- recalcular con:
    #       python3 -c "import hashlib,base64; print(base64.b64encode(hashlib.sha256(open('script.txt','rb').read()).digest()).decode())"
    #     sobre el contenido EXACTO (bytes UTF-8) entre <script> y </script>.
    #   - style-src 'unsafe-inline': SÍ hace falta -- confirmado en vivo, la app
    #     usa `style={{...}}` (estilo inline por atributo, valores dinámicos que
    #     no se pueden hashear) en decenas de componentes React, más un <style>
    #     inline en AuthProvider.tsx (splash de sesión) y otro en index.html.
    #     Menor severidad que permitir scripts inline (no ejecuta JS), tradeoff
    #     aceptado a propósito.
    #   - style-src/font-src + fonts.googleapis.com/fonts.gstatic.com: única
    #     dependencia externa real del frontend (ver
    #     src/modules/auth/login.css:8, @import de Google Fonts -- el @import
    #     en sí lo gobierna style-src, los archivos .woff2 reales font-src).
    #   - img-src/media-src/frame-src 'self' + http://localhost:58102: el
    #     explorador de archivos carga imágenes/video/audio/PDF (`<img>`,
    #     `<video><source>`, `<audio>`, `<iframe>`) desde la URL firmada que
    #     devuelve el backend (`MINIO_PUBLIC_URL`, ver
    #     filemeshy_back/app/files/service.py) -- en ESTE stack de dev ese
    #     origen es http://localhost:58102 (puerto propio de MinIO, distinto
    #     del :58100 del frontend), confirmado en vivo abriendo un preview con
    #     la consola del navegador. En producción `MINIO_PUBLIC_URL` está
    #     pensado para apuntar al MISMO origen del frontend (proxeado por el
    #     location `~ ^/(filemeshy-media|filemeshy-media-private)/` más abajo
    #     -- MinIO no tiene ningún puerto publicado en docker-compose.prod.yml,
    #     así que ahí 'self' ya alcanza sin la excepción de :58102; se deja
    #     listada igual porque no hay templating de este archivo por entorno
    #     (mismo nginx.conf para dev y prod) y no representa un origen real
    #     alcanzable en un despliegue real -- si algún día `MINIO_PUBLIC_URL`
    #     de producción NO quedara same-origin con el frontend, agregar ESE
    #     origen real acá también.
    #   - connect-src 'self': todas las llamadas a la API van al mismo origen
    #     (`initConfig()` en src/shared/config/env.ts fuerza
    #     `window.location.origin + '/api/v1'` en build de producción, que es
    #     el único build que arma el Dockerfile -- confirmado leyendo el
    #     bundle real). Sin websockets/SSE en el frontend (grep de
    #     `WebSocket`/`EventSource` sin resultados).
    #   - object-src 'none': sin Flash/plugins, no hay motivo para permitirlos.
    #   - base-uri 'self' / form-action 'self': hardening estándar contra
    #     inyección de <base> y exfiltración de formularios.
    #   - frame-ancestors 'none': se mantiene igual que antes (nadie puede
    #     embeber esta app en un <iframe>/<object> ajeno).
    #
    # Verificado en vivo (frontend reconstruido, navegado con la consola
    # abierta): login, dashboard, listado/preview de archivos (imagen, video,
    # audio, PDF) sin ningún error de CSP.
    #
    # OJO nginx: `add_header` NO se hereda a un location que ya define el suyo propio
    # (no se "mergea", se reemplaza entero) -- por eso estos 4 headers están repetidos
    # en /assets/ y en = /index.html más abajo, que ya tenían su propio Cache-Control.
    # Sacarlos de acá sin repetirlos ahí los vuelve a perder en silencio.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-qO1oaYK3nuk0giNtLxAWv+H9u1rkk0gdy1qXHXZCCWw='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' http://localhost:58102; media-src 'self' http://localhost:58102; frame-src 'self' http://localhost:58102; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Proxy al backend — evita mixed-content cuando el frontend se sirve por HTTPS
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 100m;
    }

    # Proxy a MinIO — el backend firma URLs de descarga/preview contra
    # MINIO_PUBLIC_URL (ver filemeshy_back/app/files/service.py); en producción
    # MinIO no se expone a internet, este location la sirve en el mismo origen.
    # Sin URI en proxy_pass: nginx reenvía el path+querystring tal cual llegó,
    # necesario porque la firma de la URL cubre esos parámetros.
    #
    # Ronda 9 (subida multipart directa a MinIO de archivos grandes, ver
    # app/uploads/service.py y app/core/config.py::PUBLIC_STORAGE_PROXY_URL):
    # este MISMO location, sin uno nuevo aparte, también sirve el PUT de cada
    # parte (hasta LARGE_UPLOAD_PART_SIZE_BYTES = 256MB) que el navegador
    # sube DIRECTO a MinIO vía URL presignada SigV4 -- los bytes nunca pasan
    # por el backend. `PUBLIC_STORAGE_PROXY_URL` apunta al mismo origen
    # público que ya usan las URLs de descarga (sin sufijo de path propio:
    # se descartó un location separado `/storage-proxy/` en la primera
    # versión de este archivo porque agregaba un segmento de path que
    # terminaba siendo parte del recurso firmado por SigV4 -- MinIO usa el
    # MISMO path recibido tanto para revalidar la firma como para resolver
    # bucket+key, así que un prefijo que el proxy después recorta para
    # rutear bien (`filemeshy-media-private` como bucket real) deja de
    # coincidir con lo firmado -- 403 SignatureDoesNotMatch reproducido en
    # vivo. Sin ningún prefijo de por medio, como quedó acá, el path que
    # MinIO recibe es exactamente `/<bucket>/<key>?<firma>`, igual para
    # firmar que para rutear -- no hay nada que reconciliar).
    #
    # En producción MinIO NO tiene ningún puerto publicado al host
    # (confirmado, docker-compose.prod.yml sin `ports:` en el servicio
    # `minio`) -- este location es la ÚNICA vía por la que debe quedar
    # alcanzable, tanto para descarga (GET) como para subida directa (PUT),
    # nunca un puerto nuevo de MinIO expuesto directo al host/internet.
    #
    # Límites ampliados (nunca restringidos) para cubrir también el PUT de
    # una parte grande, sin cambiar nada del comportamiento de GET que ya
    # servía este location:
    #   - `proxy_request_buffering off` -- CRÍTICO para el PUT: sin esto
    #     nginx bufferiza el body ENTERO antes de reenviarlo a MinIO,
    #     reintroduciendo el mismo problema de memoria que esta ronda entera
    #     existe para resolver (ver docstring de app/worker/tasks/av_scan.py)
    #     -- un PUT de 256MB quedaría completo en memoria/disco temporal de
    #     ESTE proceso nginx antes de salir, en vez de fluir directo. No
    #     afecta un GET (sin body de request) -- inocuo para la descarga.
    #   - `client_max_body_size 300m` -- antes sin tope propio (heredaba el
    #     default de nginx, 1m, que ya alcanzaba para un GET sin body); ahora
    #     una sola parte (256MB, ver `LARGE_UPLOAD_PART_SIZE_BYTES`) más
    #     margen, NO el tamaño del archivo completo (hasta 20GB,
    #     `MAX_LARGE_UPLOAD_SIZE_MB`): cada PUT es de una sola parte del
    #     multipart, nunca el archivo entero.
    #   - Timeouts de envío/lectura subidos a varios minutos (antes 120s,
    #     de sobra para servir un GET) -- una parte de 256MB por una
    #     conexión lenta puede tardar bastante más que eso.
    #
    # `Host` con `$http_host`, NO `$host` -- segundo hallazgo en vivo de
    # esta verificación (además del path prefix, ver arriba): `X-Amz-
    # SignedHeaders=host` en la URL presignada significa que el valor EXACTO
    # del header `Host` es parte de lo firmado, puerto incluido
    # (`localhost:58100`, el netloc completo de `PUBLIC_STORAGE_PROXY_URL`).
    # `$host` (la variable "amigable" de nginx) DESCARTA el puerto del Host
    # entrante -- reenviaba `Host: localhost` en vez de `Host: localhost:58100`,
    # 403 SignatureDoesNotMatch reproducido en vivo incluso ya con el path
    # limpio. `$http_host` preserva el header `Host` tal cual lo mandó el
    # cliente, puerto incluido -- confirmado en vivo que así sí valida.
    location ~ ^/(filemeshy-media|filemeshy-media-private)/ {
        proxy_pass              http://minio:9000;
        proxy_http_version      1.1;
        proxy_request_buffering off;
        proxy_set_header        Host              $http_host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        client_max_body_size    300m;
        proxy_connect_timeout   60s;
        proxy_send_timeout      600s;
        proxy_read_timeout      600s;
    }

    # SPA: redirigir todas las rutas a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache para assets estaticos
    #
    # Ronda 10 -- bug de herencia confirmado en vivo con curl: este location
    # ya definía su propio `add_header` (Cache-Control) y eso REEMPLAZA (no
    # mergea) los 4 del bloque server{} de arriba -- X-Frame-Options,
    # Referrer-Policy y Content-Security-Policy se perdían en silencio,
    # solo quedaba Cache-Control + X-Content-Type-Options. Se repiten los 4
    # completos acá (mismo patrón que ya usaba `= /index.html` más abajo).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-qO1oaYK3nuk0giNtLxAWv+H9u1rkk0gdy1qXHXZCCWw='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' http://localhost:58102; media-src 'self' http://localhost:58102; frame-src 'self' http://localhost:58102; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }

    # No cachear index.html
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-qO1oaYK3nuk0giNtLxAWv+H9u1rkk0gdy1qXHXZCCWw='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' http://localhost:58102; media-src 'self' http://localhost:58102; frame-src 'self' http://localhost:58102; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }
}
