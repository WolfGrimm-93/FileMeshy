server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Headers de seguridad HTTP -- el backend ya los manda en sus respuestas JSON
    # (app/main.py::SecurityHeadersMiddleware), pero el HTML de la SPA (donde vive
    # la sesión real) no pasaba por ahí y salía sin ninguno. CSP acá es solo
    # frame-ancestors (no default-src): el explorador de archivos carga imágenes/PDF
    # de MinIO en otro origen (`<img>`/`<iframe>` a la URL firmada) para el preview
    # del Hito 2 -- un default-src 'self' como el del backend rompería esa feature.
    #
    # OJO nginx: `add_header` NO se hereda a un location que ya define el suyo propio
    # (no se "mergea", se reemplaza entero) -- por eso estos 4 headers están repetidos
    # en /assets/ y en = /index.html más abajo, que ya tenían su propio Cache-Control.
    # Sacarlos de acá sin repetirlos ahí los vuelve a perder en silencio.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    # Proxy al backend — evita mixed-content cuando el frontend se sirve por HTTPS
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 100m;
    }

    # Proxy a MinIO — el backend firma URLs de descarga/preview contra
    # MINIO_PUBLIC_URL (ver filemeshy_back/app/files/service.py); en producción
    # MinIO no se expone a internet, este location la sirve en el mismo origen.
    # Sin URI en proxy_pass: nginx reenvía el path+querystring tal cual llegó,
    # necesario porque la firma de la URL cubre esos parámetros.
    location ~ ^/(filemeshy-media|filemeshy-media-private)/ {
        proxy_pass         http://minio:9000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # SPA: redirigir todas las rutas a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache para assets estaticos
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # No cachear index.html
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
    }
}
