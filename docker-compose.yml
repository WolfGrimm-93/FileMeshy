# Orquesta los 2 subproyectos (backend/frontend) para probarlos juntos en local.
#
# Stack completamente AISLADO de cualquier base de datos compartida con otros
# proyectos en la misma máquina -- este compose levanta su PROPIO
# Postgres/Redis/MinIO vacíos, en un rango de puertos distinto (58100-58105)
# para no chocar ni confundirse con nada de eso. Las credenciales de abajo son
# de desarrollo local solamente, no se usan en ningún entorno real.
#
# Uso:
#   docker compose up --build           # backend + frontend + DB + redis + minio + worker
#
# Pendiente conocido (ver pendiente.md): la migración baseline crea el schema
# pero no siembra `permissions`/`role_permissions` -- después de `up`, la API
# funciona pero el RBAC no tiene permisos cargados todavía.

x-backend-env: &backend-env
  ENVIRONMENT: development
  DEBUG: "True"
  PROJECT_NAME: FileMeshy API
  DATABASE_URL: postgresql://filemeshy:filemeshy_dev_only@postgres:5432/filemeshy
  SECRET_KEY: dev-only-secret-do-not-use-in-production
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  MINIO_ENDPOINT: http://minio:9000
  MINIO_ACCESS_KEY: filemeshy_minio_admin
  MINIO_SECRET_KEY: filemeshy_minio_dev_only
  MINIO_PUBLIC_URL: http://localhost:58102
  MINIO_BUCKET: filemeshy-media
  MINIO_PRIVATE_BUCKET: filemeshy-media-private
  BACKEND_CORS_ORIGINS: '["http://localhost:58100"]'
  DEPLOYMENT_MODE: local
  # Servicio aislado de conversión Office->PDF para preview (Ronda 5, ver
  # app/core/config.py::OFFICE_CONVERTER_URL). Nombre/puerto de servicio
  # asumidos por contrato -- el servicio en sí (imagen, Dockerfile, definición
  # dentro de `services:`) lo agrega el agente que construye
  # `filemeshy_office_converter/` en paralelo, NO este archivo. Si ese
  # servicio termina llamándose distinto o expone otro puerto, ajustar SOLO
  # esta variable.
  OFFICE_CONVERTER_URL: http://office_converter:8080
  # Vacío a propósito -- en este stack de dev nada llega al backend a través
  # de un proxy real (el frontend expone su propio puerto, 58100, pero las
  # pruebas/uso manual le pegan directo al backend en 58101). Ver
  # app/core/config.py::TRUSTED_PROXY_IPS / app/auth/router.py::_get_real_ip.
  TRUSTED_PROXY_IPS: "[]"

# Build y TAG compartidos por `backend` y `celery_worker` (mismo codigo, mismo Dockerfile).
# Incidente de la Ronda 12: cada servicio tenia su propia imagen (filemeshy-backend y
# filemeshy-celery_worker) y `docker compose build backend` NO reconstruia la del worker,
# que estuvo corriendo con dependencias viejas (fastapi 0.115, pillow 11...) mientras los
# informes decian lo contrario. Con un unico tag (`image: filemeshy-backend`) reconstruir
# cualquiera de los dos deja ambos en la misma imagen y no pueden desfasarse.
# Verificacion tras cada deploy (ver docs/operacion.md): los IDs deben ser identicos:
#   docker inspect --format '{{.Image}}' filemeshy-backend-1 filemeshy-celery_worker-1
x-backend-build: &backend-build
  context: ./filemeshy_back

services:
  postgres:
    # Pin de versión + digest (Ronda 10) -- mismo criterio que MinIO (Ronda 1):
    # sin esto, "15-alpine" es una tag flotante que puede traer un patch nuevo
    # (con CVEs corregidos o, peor, regresiones) sin aviso en cualquier rebuild.
    # 15.19-alpine es la build vigente al 2026-09-22 (confirmado con
    # `postgres --version` corriendo la imagen real); el digest fija ESE
    # binario exacto para siempre, sin depender de que la tag no se re-apunte.
    image: postgres:15.19-alpine@sha256:f7d23353e1b15400d22ebe31189f4d314b87a4c129cc400c8c2d8d4ca127bf81
    environment:
      POSTGRES_USER: filemeshy
      POSTGRES_PASSWORD: filemeshy_dev_only
      POSTGRES_DB: filemeshy
    ports:
      - "58104:5432"
    volumes:
      - filemeshy_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filemeshy"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    # Pin de versión + digest (Ronda 10) -- mismo criterio que postgres arriba.
    # 7.4.11-alpine vigente al 2026-09-22 (confirmado con `redis-server
    # --version` corriendo la imagen real).
    image: redis:8.10.2-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    ports:
      - "58105:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # Pin de version -- `minio/minio:latest` en Docker Hub ademas quedo
    # despublicado por MinIO (movieron sus imagenes a quay.io), asi que
    # "latest" sin pin ni siquiera resuelve mas. RELEASE.2025-09-07 es la
    # ultima tag estable conocida al momento de este fix.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: filemeshy_minio_admin
      MINIO_ROOT_PASSWORD: filemeshy_minio_dev_only
    ports:
      - "58102:9000"
      - "58103:9001"
    volumes:
      - filemeshy_minio_data:/data
    # `mc ready local` viene incluido en la imagen oficial (mismo check que
    # ya usa docker-compose.prod.yml).
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build: *backend-build
    image: filemeshy-backend
    environment:
      <<: *backend-env
    # Filesystem de solo lectura -- el proceso corre como `appuser` no-root
    # (ver filemeshy_back/Dockerfile) y no tiene ningun motivo para escribir
    # sobre su propio codigo en runtime. `/tmp` (temporales de pyvips/etc.) y
    # `/app/logs` (app_logger, ver app/core/logging_config.py) son las UNICAS
    # rutas donde escribe -- quedan como tmpfs (efimero, se pierde al
    # reiniciar el contenedor; aceptable para logs de dev).
    read_only: true
    tmpfs:
      - /tmp
      - /app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      # Ahora `service_healthy`: office_converter tiene healthcheck propio
      # (ver más abajo), así el backend no arranca antes de que el conversor
      # responda.
      office_converter:
        condition: service_healthy
      # Ronda 7: antivirus -- ver comentario completo del servicio `clamav`
      # más abajo. A diferencia de `office_converter`, acá SÍ usamos
      # `service_healthy`: la imagen oficial trae un healthcheck real
      # (`clamdcheck.sh`) y la base de firmas puede tardar varios minutos en
      # descargarse la primera vez -- sin esperar a que esté sana de verdad,
      # el backend arrancaría y cualquier upload fallaría con 503 (fail
      # closed, ver app/files/router.py::_scan_for_malware_or_raise) hasta
      # que clamd termine de inicializar.
      clamav:
        condition: service_healthy
    ports:
      - "58101:8000"
    # Redes: `default` (postgres/redis/minio + salida a internet) más las dos
    # internas de aislamiento (ver bloque `networks:` al final del archivo).
    networks:
      - default
      - av_net
      - converter_net
    # Healthcheck: la imagen no trae curl/wget y corre como no-root con
    # filesystem read-only, así que se usa urllib de la stdlib de Python.
    # /health responde 200 aun con la BD caída (el estado viaja en el JSON),
    # por eso se valida el campo `status` y no solo el código HTTP.
    # `start_period` largo: el CMD corre `alembic upgrade head` antes de
    # uvicorn y, en el primer arranque, esta espera a clamav (depends_on).
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,sys,urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4); sys.exit(0 if r.status==200 and json.load(r).get('status')=='healthy' else 1)"
      interval: 30s
      timeout: 6s
      retries: 5
      start_period: 60s

  celery_worker:
    build: *backend-build
    image: filemeshy-backend
    command: celery -A app.worker.celery_app worker --loglevel=info
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      # NO depende de `clamav` a propósito -- el worker de Celery (Ronda 6:
      # indexación/OCR) solo procesa contenido que YA pasó el escaneo de
      # `backend` al subirse, nunca escanea nada él mismo.
    # Redes: `default` + `av_net` (la tarea av_scan de Ronda 9 sí habla con
    # clamd para escanear archivos grandes ya subidos a MinIO).
    networks:
      - default
      - av_net
    # `inspect ping` es pesado (levanta la app de Celery entera): intervalo
    # largo a propósito. Se apunta al hostname propio del worker
    # (`celery@<hostname del contenedor>`, el default de Celery) para no
    # depender de otros workers que pudieran compartir el broker. `$$` evita
    # que compose interpole la variable: la resuelve el shell del contenedor.
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker.celery_app inspect ping -d celery@$$HOSTNAME --timeout 10"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 40s

  # Ronda 5: conversion Office -> PDF via LibreOffice headless, en su
  # propio contenedor aislado (ver filemeshy_office_converter/Dockerfile
  # para el razonamiento completo: CVE de RCE reales al parsear documentos
  # con LibreOffice, mitigados con contenedor separado + no-root +
  # read-only + sin capabilities + sin macros + limites de recursos, en
  # vez de correrlo embebido como hace ownCloud sin aislar -- practica que
  # ownCloud mismo marca "unsupported").
  #
  # SIN `ports:` a proposito -- solo `backend` le habla, por nombre de
  # servicio en la red interna de compose (OFFICE_CONVERTER_URL arriba).
  office_converter:
    build:
      context: ./filemeshy_office_converter
    read_only: true
    tmpfs:
      # Unico lugar donde el proceso escribe: archivo de entrada, PDF de
      # salida y perfil efimero de LibreOffice por conversion (ver
      # server.py). Se limpia solo al final de cada request, pero igual
      # queda acotado a tmpfs para que nada sobreviva a un reinicio ni
      # pueda llenar disco real del host.
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Limite de recursos -- no hay precedente en este compose (backend/
    # celery_worker no lo tienen), lo agregamos igual como buena practica
    # nueva especifica de este servicio: LibreOffice parseando un
    # documento malicioso/corrupto es exactamente el tipo de proceso que
    # puede intentar consumir toda la memoria o CPU disponible, y este
    # contenedor no deberia poder afectar al resto del stack si eso pasa.
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 128
    restart: unless-stopped
    # SOLO en `converter_net` (internal: true, sin salida a internet): un
    # documento malicioso que logre ejecutar código en LibreOffice no puede
    # exfiltrar datos ni bajar payloads. Solo `backend` la comparte.
    # El hostname `office_converter` sigue resolviendo desde backend.
    networks:
      - converter_net
    # python3 está en el PATH de la imagen (venv /opt/venv/bin). /health no
    # invoca soffice, es liviano.
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=4).status==200 else 1)"
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 20s

  # Ronda 7: antivirus -- escaneo de malware (ClamAV) de todo contenido
  # nuevo ANTES de subirlo a MinIO (ver app/files/service.py::scan_for_malware
  # y app/files/router.py::_scan_for_malware_or_raise, política fail-closed:
  # infectado o clamd caído -> se rechaza, nunca se sube sin escanear).
  #
  # Imagen OFICIAL `clamav/clamav:stable` -- a diferencia de
  # `office_converter` (Ronda 5), acá NO se construye nada custom: ya trae
  # `freshclam` integrado para mantener las firmas actualizadas, no hay nada
  # que reinventar.
  #
  # SIN `ports:` a propósito -- mismo criterio que `office_converter`: solo
  # `backend` le habla (`CLAMAV_HOST`/`CLAMAV_PORT`, ver
  # app/core/config.py), por nombre de servicio en la red interna de
  # compose, nunca alcanzable desde el host.
  #
  # `read_only: true` NO es viable acá (a diferencia de `office_converter`):
  # clamd/freshclam necesitan escribir la base de firmas en
  # `/var/lib/clamav` en runtime -- se deja ese único directorio como volumen
  # NOMBRADO (`clamav_data`) en vez de read-only total, importante que sea
  # persistente entre reinicios o cada arranque tendría que re-descargar
  # cientos de MB de firmas desde cero.
  #
  # No-root: confirmado en vivo (`docker inspect` + `cat /init` +
  # `id clamav` + `ps aux` dentro del contenedor corriendo) -- los procesos
  # `clamd`/`freshclam`, los que efectivamente procesan contenido no
  # confiable, corren como `clamav` (uid=100/gid=101): `clamd` por la
  # directiva `User clamav` que ya trae `/etc/clamav/clamd.conf` de fábrica,
  # `freshclam` porque el entrypoint lo lanza con `--user=clamav` explícito.
  # Solo el proceso 1 (`tini`/`/init`) queda como root durante toda la vida
  # del contenedor -- ESE root nunca toca red ni contenido de archivos, solo
  # hace de supervisor (arranca los daemons y hace `tail -f /dev/null`).
  #
  # cap_drop CASI total, no ALL: se probó primero `cap_drop: [ALL]` (mismo
  # criterio que `office_converter`) y el entrypoint oficial falla en
  # arrancar -- `chown -R clamav:clamav /var/lib/clamav` (necesario para que
  # el volumen nombrado, creado por Docker con dueño root, quede escribible
  # por `clamav`) sale con "Operation not permitted" en loop y el contenedor
  # nunca llega a levantar clamd (confirmado en vivo, reproducido y
  # solucionado antes de este commit). Se le vuelven a dar solo las 5
  # capabilities mínimas que ese arranque necesita (CHOWN/FOWNER/
  # DAC_OVERRIDE para el chown, SETUID/SETGID para que clamd/freshclam
  # puedan bajar privilegios a `clamav`) -- probado en vivo con este set
  # exacto: arranca limpio y clamd corre como no-root igual. Diferencia con
  # `office_converter`: ese servicio nunca necesita ser root ni un instante,
  # este sí lo necesita brevemente al arrancar para preparar un volumen
  # persistente.
  clamav:
    # Pin por DIGEST (Ronda 10) -- a diferencia de postgres/redis, "stable"
    # no tiene un esquema de versión propio confiable como tag (a la fecha
    # resuelve a ClamAV 1.5.4/28129, confirmado con `clamscan --version`
    # corriendo la imagen real, pero "stable" es una tag flotante por
    # diseño -- freshclam actualiza firmas, y la imagen en sí puede saltar
    # de versión sin aviso). El digest fija el binario+base exactos
    # vigentes al 2026-09-22; se mantiene la tag "stable" en la referencia
    # (en vez de una tag numerada) porque el propósito de "stable" sigue
    # siendo válido como documentación de intención, el digest es lo que
    # realmente ancla la reproducibilidad.
    image: clamav/clamav:stable@sha256:0e31ce089574268aefa0b543767d66b70240ab51ed49eec53e07f18d5629d817
    volumes:
      - clamav_data:/var/lib/clamav
    # Ronda 9: escaneo asíncrono de archivos grandes -- por defecto la imagen
    # trae StreamMaxLength/MaxScanSize/MaxFileSize en unos pocos cientos de
    # MB (ver /etc/clamav/clamd.conf de fábrica), muy por debajo de
    # MAX_LARGE_UPLOAD_SIZE_MB (20GB, ver app/worker/tasks/av_scan.py). Sin
    # subir estos 3 límites, clamd cortaría la conexión INSTREAM a mitad de
    # un archivo grande con "size limit exceeded" -- el escaneo async
    # (`scan_minio_object_for_malware` en app/files/service.py) fallaría
    # SIEMPRE para cualquier archivo de más de unos cientos de MB, sin
    # importar cuánta memoria/tiempo se le dé al worker.
    #
    # El entrypoint oficial de esta imagen (`/init`, confirmado leyéndolo en
    # vivo dentro del contenedor) soporta config por variables de entorno
    # `CLAMD_CONF_<Directiva>` -- descomenta/reemplaza esa directiva en
    # `clamd.conf` en el arranque, no hace falta un volumen con config
    # propia. 21000M (margen sobre los 20480MB de MAX_LARGE_UPLOAD_SIZE_MB)
    # en los 3 -- StreamMaxLength gatea el tamaño del stream INSTREAM en sí,
    # MaxFileSize el tamaño del "archivo" escaneado, MaxScanSize el total de
    # datos escaneados (relevante si algún día se escanean archivos
    # comprimidos) -- un archivo grande no-comprimido pega contra los 3 casi
    # por igual, así que los 3 quedan iguales.
    environment:
      CLAMD_CONF_StreamMaxLength: "21000M"
      CLAMD_CONF_MaxScanSize: "21000M"
      CLAMD_CONF_MaxFileSize: "21000M"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    # Ronda 7: 2g bastaba para escanear en memoria bytes ya acotados a
    # decenas/cientos de MB por request síncrono. Ronda 9: MEDIDO EN VIVO
    # contra este mismo stack (no una suposición) con blobs benignos reales
    # de 2GB y 6GB subidos a MinIO y escaneados por streaming real (socket
    # INSTREAM, cgroup memory.current leído directo de
    # /sys/fs/cgroup/.../memory.current cada 50-100ms durante el escaneo):
    #
    #   - Idle, con la base de firmas completa cargada: ~1.0-1.15GB estable.
    #   - Un escaneo de 6GB: la memoria SUBE de forma aprox. proporcional a
    #     los bytes ya recibidos, no se mantiene plana -- `clamd` escribe el
    #     stream INSTREAM a un archivo temporal (`TemporaryDirectory`, no
    #     seteado = default de clamd, cae en el filesystem del propio
    #     contenedor, que acá es disco real vía overlay2, NO tmpfs) y lo
    #     relee para escanear; ese archivo temporal cuenta como memoria de
    #     la cgroup vía page cache (`memory.current` en cgroup v2 incluye
    #     cache de archivo, no solo RSS de aplicación).
    #   - CRÍTICO -- probado a propósito con `mem_limit` bajo (3g) durante
    #     un escaneo de 6GB, y de nuevo con 2 escaneos de 6GB EN PARALELO
    #     contra un límite de 8g: en ambos casos la memoria de la cgroup
    #     quedó pegada EXACTO en el tope configurado durante el resto del
    #     escaneo (el kernel recicla ese page cache bajo presión en vez de
    #     matar el proceso, porque es reclamable) y el escaneo terminó
    #     limpio igual ("stream: OK" real) las 2 veces -- un `mem_limit`
    #     por debajo del tamaño del archivo NO rompe el escaneo, solo fuerza
    #     más I/O de disco real (hay de sobra: NVMe con cientos de GB
    #     libres) en vez de servir todo desde cache.
    #
    # Con eso confirmado (capar memoria es seguro, no catastrófico), 6g
    # es una elección deliberada de equilibrio, no el peor caso extremo:
    # cubre sin fricción el caso común (baseline ~1.1GB + varios GB de
    # margen para un solo archivo grande típico) y, para el caso extremo
    # (2 archivos de 15-20GB terminando casi juntos, tope real de
    # `AV_SCAN_CONCURRENCY_LIMIT=2` en app/worker/tasks/av_scan.py), se
    # apoya en el reciclado de page cache ya validado en vivo arriba en vez
    # de reservarle a este único contenedor decenas de GB dedicados en un
    # host de 30GB que además comparte con otros proyectos de esta misma
    # máquina (ver Homelab/Desarrollo en Obsidian). El límite de
    # concurrencia del semáforo Redis es la defensa PRIMARIA contra que
    # muchos escaneos grandes simultáneos tumben `clamd`; `mem_limit` es el
    # backstop, no la única capa.
    mem_limit: 6g
    cpus: 1.0
    pids_limit: 256
    # La imagen ya trae su propio HEALTHCHECK (`clamdcheck.sh`, ver
    # `docker inspect clamav/clamav:stable`) -- se pisa acá solo para subir
    # `start_period`: el default de la imagen (360s) puede no alcanzar si la
    # descarga inicial de firmas es lenta (cientos de MB la primera vez),
    # y `retries`/`interval` quedan más generosos por el mismo motivo.
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 900s
    restart: unless-stopped
    # Redes: `av_net` (internal, backend/celery_worker le hablan por acá) y
    # `clamav_egress` (bridge normal, SOLO para que freshclam baje firmas).
    # NO está en `default`: postgres/redis/minio/frontend no lo alcanzan.
    # Trampa del gateway por defecto: un contenedor multi-red toma su ruta
    # por defecto de una red con gateway; las redes `internal: true` no
    # tienen, así que la salida debería ir por `clamav_egress`. Verificar en
    # vivo (no se probó al escribir esto): `docker compose exec clamav
    # freshclam` debe terminar sin errores de red, o
    # `docker compose logs clamav | grep -i freshclam`. Si falla, revisar
    # `docker compose exec clamav ip route`.
    networks:
      - av_net
      - clamav_egress

  frontend:
    build:
      context: ./filemeshy_front
    depends_on:
      - backend
    # Healthcheck: 127.0.0.1 (no localhost), nginx solo escucha IPv4.
    # `depends_on: backend` se mantiene en service_started a propósito:
    # el backend espera a clamav (start_period 900s) y no se quiere retrasar
    # el frontend ~15 min en el primer arranque.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - "58100:80"

# Aislamiento de red (defensa en profundidad). Las redes `internal: true` no
# tienen ruta hacia afuera. Los nombres de servicio (`clamav`,
# `office_converter`) siguen resolviendo por DNS de compose en las redes
# compartidas, no hace falta tocar CLAMAV_HOST ni OFFICE_CONVERTER_URL.
networks:
  av_net:
    internal: true
  converter_net:
    internal: true
  clamav_egress:
    driver: bridge

volumes:
  filemeshy_postgres_data:
  filemeshy_minio_data:
  clamav_data:
