# Orquesta los 2 subproyectos (backend/frontend) para probarlos juntos en local.
#
# Stack completamente AISLADO de cualquier base de datos compartida con otros
# proyectos en la misma máquina -- este compose levanta su PROPIO
# Postgres/Redis/MinIO vacíos, en un rango de puertos distinto (58100-58105)
# para no chocar ni confundirse con nada de eso. Las credenciales de abajo son
# de desarrollo local solamente, no se usan en ningún entorno real.
#
# Uso:
#   docker compose up --build           # backend + frontend + DB + redis + minio + worker
#
# Pendiente conocido (ver pendiente.md): la migración baseline crea el schema
# pero no siembra `permissions`/`role_permissions` -- después de `up`, la API
# funciona pero el RBAC no tiene permisos cargados todavía.

x-backend-env: &backend-env
  ENVIRONMENT: development
  DEBUG: "True"
  PROJECT_NAME: FileMeshy API
  DATABASE_URL: postgresql://filemeshy:filemeshy_dev_only@postgres:5432/filemeshy
  SECRET_KEY: dev-only-secret-do-not-use-in-production
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  MINIO_ENDPOINT: http://minio:9000
  MINIO_ACCESS_KEY: filemeshy_minio_admin
  MINIO_SECRET_KEY: filemeshy_minio_dev_only
  MINIO_PUBLIC_URL: http://localhost:58102
  MINIO_BUCKET: filemeshy-media
  MINIO_PRIVATE_BUCKET: filemeshy-media-private
  BACKEND_CORS_ORIGINS: '["http://localhost:58100"]'
  DEPLOYMENT_MODE: local
  # Servicio aislado de conversión Office->PDF para preview (Ronda 5, ver
  # app/core/config.py::OFFICE_CONVERTER_URL). Nombre/puerto de servicio
  # asumidos por contrato -- el servicio en sí (imagen, Dockerfile, definición
  # dentro de `services:`) lo agrega el agente que construye
  # `filemeshy_office_converter/` en paralelo, NO este archivo. Si ese
  # servicio termina llamándose distinto o expone otro puerto, ajustar SOLO
  # esta variable.
  OFFICE_CONVERTER_URL: http://office_converter:8080
  # Vacío a propósito -- en este stack de dev nada llega al backend a través
  # de un proxy real (el frontend expone su propio puerto, 58100, pero las
  # pruebas/uso manual le pegan directo al backend en 58101). Ver
  # app/core/config.py::TRUSTED_PROXY_IPS / app/auth/router.py::_get_real_ip.
  TRUSTED_PROXY_IPS: "[]"

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: filemeshy
      POSTGRES_PASSWORD: filemeshy_dev_only
      POSTGRES_DB: filemeshy
    ports:
      - "58104:5432"
    volumes:
      - filemeshy_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filemeshy"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "58105:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # Pin de version -- `minio/minio:latest` en Docker Hub ademas quedo
    # despublicado por MinIO (movieron sus imagenes a quay.io), asi que
    # "latest" sin pin ni siquiera resuelve mas. RELEASE.2025-09-07 es la
    # ultima tag estable conocida al momento de este fix.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: filemeshy_minio_admin
      MINIO_ROOT_PASSWORD: filemeshy_minio_dev_only
    ports:
      - "58102:9000"
      - "58103:9001"
    volumes:
      - filemeshy_minio_data:/data

  backend:
    build:
      context: ./filemeshy_back
    environment:
      <<: *backend-env
    # Filesystem de solo lectura -- el proceso corre como `appuser` no-root
    # (ver filemeshy_back/Dockerfile) y no tiene ningun motivo para escribir
    # sobre su propio codigo en runtime. `/tmp` (temporales de pyvips/etc.) y
    # `/app/logs` (app_logger, ver app/core/logging_config.py) son las UNICAS
    # rutas donde escribe -- quedan como tmpfs (efimero, se pierde al
    # reiniciar el contenedor; aceptable para logs de dev).
    read_only: true
    tmpfs:
      - /tmp
      - /app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      # Definido por el agente que construye `filemeshy_office_converter/`
      # en paralelo (Ronda 5) -- ver comentario de OFFICE_CONVERTER_URL más
      # arriba. `condition: service_started` (no `service_healthy`) porque
      # todavía no se sabe si ese servicio va a exponer un healthcheck.
      office_converter:
        condition: service_started
    ports:
      - "58101:8000"

  celery_worker:
    build:
      context: ./filemeshy_back
    command: celery -A app.worker.celery_app worker --loglevel=info
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  # Ronda 5: conversion Office -> PDF via LibreOffice headless, en su
  # propio contenedor aislado (ver filemeshy_office_converter/Dockerfile
  # para el razonamiento completo: CVE de RCE reales al parsear documentos
  # con LibreOffice, mitigados con contenedor separado + no-root +
  # read-only + sin capabilities + sin macros + limites de recursos, en
  # vez de correrlo embebido como hace ownCloud sin aislar -- practica que
  # ownCloud mismo marca "unsupported").
  #
  # SIN `ports:` a proposito -- solo `backend` le habla, por nombre de
  # servicio en la red interna de compose (OFFICE_CONVERTER_URL arriba).
  office_converter:
    build:
      context: ./filemeshy_office_converter
    read_only: true
    tmpfs:
      # Unico lugar donde el proceso escribe: archivo de entrada, PDF de
      # salida y perfil efimero de LibreOffice por conversion (ver
      # server.py). Se limpia solo al final de cada request, pero igual
      # queda acotado a tmpfs para que nada sobreviva a un reinicio ni
      # pueda llenar disco real del host.
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Limite de recursos -- no hay precedente en este compose (backend/
    # celery_worker no lo tienen), lo agregamos igual como buena practica
    # nueva especifica de este servicio: LibreOffice parseando un
    # documento malicioso/corrupto es exactamente el tipo de proceso que
    # puede intentar consumir toda la memoria o CPU disponible, y este
    # contenedor no deberia poder afectar al resto del stack si eso pasa.
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 128
    restart: unless-stopped

  frontend:
    build:
      context: ./filemeshy_front
    depends_on:
      - backend
    ports:
      - "58100:80"

volumes:
  filemeshy_postgres_data:
  filemeshy_minio_data:
