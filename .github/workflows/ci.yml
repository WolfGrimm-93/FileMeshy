name: CI

on:
  push:
  pull_request:

# Mínimo privilegio: los jobs solo leen el repo.
permissions:
  contents: read

# Cancela ejecuciones anteriores de la misma rama/PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# PENDIENTE: las actions están pineadas por versión mayor (tag), no por SHA de
# commit. Pinear por SHA cuando se pueda verificar cada SHA contra el repo
# oficial (dependabot con github-actions las mantiene al día).

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Versión fija: es la misma con la que se midió el baseline de
      # filemeshy_back/ruff.toml. Actualizarla junto con ruff.toml (y con los
      # PR de dependabot/ruff) para que las reglas no cambien sin aviso.
      - name: Instalar ruff
        run: pip install ruff==0.16.9
      - name: ruff check (config en filemeshy_back/ruff.toml)
        run: ruff check filemeshy_back

  # Tests de backend contra el stack real del compose (postgres, redis,
  # minio, clamav). NO VERIFICADO EN RUNNER: se escribió sin poder ejecutarlo,
  # por eso `continue-on-error: true`. Quitarlo tras la primera corrida verde.
  # Esperado: ~311 passed (Ronda 12; el número crece con cada ronda, no es un umbral) y 8 skipped (tests cloud-only, es normal).
  # Los tests usan la BD viva del stack y crean datos pytest_*; en CI el stack
  # es efímero, no importa. El primer arranque descarga firmas de ClamAV
  # (hasta ~15 min), de ahí el timeout generoso.
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Levantar el stack (build + esperar healthchecks)
        run: docker compose up -d --build --wait --wait-timeout 1500
      # El filesystem del contenedor backend es read-only: las dependencias de
      # test se instalan con --target en /tmp (tmpfs).
      - name: Instalar dependencias de test
        run: docker compose exec -T backend sh -c 'pip install --target /tmp/pydeps -r requirements-dev.txt'
      - name: pytest
        run: docker compose exec -T -e PYTHONPATH=/tmp/pydeps backend python -m pytest tests -q -p no:cacheprovider
      - name: Logs del stack (si falla)
        if: failure()
        run: docker compose logs --no-color > compose-logs.txt
      - name: Publicar logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: compose-logs
          path: compose-logs.txt
      # Solo en el runner de CI (efímero), nunca en local.
      - name: Bajar el stack
        if: always()
        run: docker compose down -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: filemeshy_front
    steps:
      - uses: actions/checkout@v4
      # La versión de pnpm sale de "packageManager" en package.json.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: filemeshy_front/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: filemeshy_front/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Baseline limpio (0 errores/0 warnings): bloqueante para frenar regresiones.
      - name: eslint
        run: pnpm exec eslint .
      - name: type-check (tsc -b)
        run: pnpm exec tsc -b
      - name: tests
        run: pnpm test
      - name: build de producción
        run: pnpm build:prod

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Solo build (sin up); `docker compose build` construye los servicios
      # con `build:` de forma secuencial en el mismo runner.
      - name: docker compose build
        run: docker compose build

  # SCA: baseline en 0 vulnerabilidades, todo bloqueante.
  # Limitación: el backend se audita con --no-deps --disable-pip (es lo que se
  # midió localmente: 0 hallazgos); las dependencias transitivas del backend
  # no están cubiertas. Pendiente: auditar con resolución completa cuando se
  # verifique en un runner con Python 3.11.
  sca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar pip-audit
        run: pip install pip-audit
      - name: pip-audit backend
        run: pip-audit --no-deps --disable-pip -r filemeshy_back/requirements.txt
      - name: pip-audit office_converter
        run: pip-audit -r filemeshy_office_converter/requirements.txt
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: filemeshy_front/package.json
      - name: pnpm audit (prod)
        working-directory: filemeshy_front
        run: pnpm audit --prod
      - name: pnpm audit (completo)
        working-directory: filemeshy_front
        run: pnpm audit
