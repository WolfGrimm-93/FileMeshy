version: 2
updates:
  - package-ecosystem: pip
    directory: /filemeshy_back
    schedule: { interval: weekly }
    groups:
      python-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /filemeshy_office_converter
    schedule: { interval: weekly }
    groups:
      python-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /filemeshy_front
    schedule: { interval: weekly }
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /filemeshy_back
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /filemeshy_front
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /filemeshy_office_converter
    schedule: { interval: weekly }
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly }
    groups:
      compose-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
